version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      electron-toolchain:
        patterns: ['electron', 'electron-*', '@electron/*', 'typescript', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
