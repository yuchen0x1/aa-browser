name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: aa-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-latest }
          - { platform: linux-x64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:frame-elements
      - run: npm run test:tools
      - run: npm run validate:codex
      - run: npm run validate:workbuddy
      - run: npm run build
      - name: Generate software bill of materials
        run: npm run sbom
      - name: Headless desktop display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2t64 libgtk-3-0t64 libnss3 libgbm1 libasound2t64
          # Enable Chromium user namespaces on this ephemeral CI runner.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Electron regression
        shell: bash
        run: |
          set -euo pipefail
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          "${display[@]}" npm run smoke
          "${display[@]}" npm run test:desktop
          "${display[@]}" npm run test:update-ui
          "${display[@]}" npm run test:ui-ux
          "${display[@]}" npm run test:settings-safety
          "${display[@]}" npm run test:newtab-i18n
          "${display[@]}" npm run test:app-i18n
          "${display[@]}" npm run test:site-ui
          "${display[@]}" npm run test:site-interactions
          if [ "$RUNNER_OS" = Linux ]; then
            # Keep the 960×640 DIP window within the display at forced 2x scale.
            xvfb-run -a -s '-screen 0 2560x1600x24' npm run test:display-matrix
          else
            npm run test:display-matrix
          fi
      - run: npm run test:stores
      - run: npm run test:main-diagnostics
      - run: npm run test:printing
      - run: npm run test:security
      - run: npm run test:updater
      - run: npm run test:release
      - run: npm run test:installer
      - run: npm run test:bridge
      - run: npm run test:bridge-connection-race
      - run: npm run test:bridge-lifecycle
      - run: npm run test:agent-cancellation
      - run: npm run test:session-permissions
      - run: npm run test:approval-parity
      - name: Bridge cold auto-launch regression
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:bridge-autolaunch
          else
            npm run test:bridge-autolaunch
          fi
      - name: Package and validate platform assets
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            npm run dist:linux -- --publish never
          else
            npm run dist -- --publish never
          fi
          node scripts/release-assets.mjs prepare "${{ matrix.platform }}"
      - name: Verify connect-only installer against the packaged app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/test-connect-flow.mjs
          else
            node scripts/test-connect-flow.mjs
          fi
      - name: Launch Linux AppImage and connect its MCP bridge
        if: runner.os == 'Linux'
        run: APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a npm run smoke -- release/*.AppImage
      - name: Install Windows NSIS package, exercise MCP and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          $installDir = Join-Path $env:RUNNER_TEMP 'aa-browser-installed'
          $installer = Start-Process -Wait -PassThru -WindowStyle Hidden -FilePath "release/aa-browser-setup-$version.exe" -ArgumentList "/S /D=$installDir"
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed: $($installer.ExitCode)" }
          npm run smoke -- (Join-Path $installDir 'Aa Browser.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Start-Process -Wait -PassThru -WindowStyle Hidden -FilePath (Join-Path $installDir 'Uninstall Aa Browser.exe') -ArgumentList '/S'
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path (Join-Path $installDir 'Aa Browser.exe'))) { throw 'NSIS uninstall failed' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: release-${{ matrix.platform }}
          path: release/validated/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tested release
    if: github.repository == 'yuchen0x1/aa-browser' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check version and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test -s "release-notes-$RELEASE_TAG.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate SBOM for the tested release
        run: npm run sbom
      - run: node scripts/release-assets.mjs manifest
      - name: Publish and verify assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishRelease } = await import(process.cwd() + '/scripts/publish-release.mjs')
            await publishRelease(github.rest.repos, context.repo, context.ref.slice('refs/tags/'.length), context.sha, core.info)
