name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aa-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:frame-elements
      - run: npm run test:tools
      - run: npm run validate:codex
      - run: npm run validate:opencode
      - run: npm run validate:workbuddy

  unit:
    name: Unit suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 每个套件都跑完再统一失败：一个套件出错不再掩盖后面的 15 个套件。
      - name: Node-only regression suites
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          for suite in \
            test:stores test:main-diagnostics test:client-config test:printing \
            test:security test:updater test:update-restart test:release \
            test:installer test:bridge test:bridge-connection-race \
            test:bridge-lifecycle test:bridge-restart-replay \
            test:agent-cancellation test:task-center test:session-permissions test:approval-parity
          do
            echo "::group::$suite"
            if npm run "$suite"; then echo "::endgroup::"; else echo "::error::$suite failed"; failed+=("$suite"); echo "::endgroup::"; fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi
      - name: Generate software bill of materials
        run: npm run sbom

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Headless desktop display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils libfuse2t64 libgtk-3-0t64 libnss3 libgbm1 libasound2t64
          # Enable Chromium user namespaces on this ephemeral CI runner.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # 单个套件失败不再把后面的套件全部标成 skipped，一次运行即可看到完整失败面；
      # 失败原因写进 ::error:: 分组，最后统一以非零退出码收尾。
      - name: Electron suites
        shell: bash
        run: |
          set -uo pipefail
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          failed=()
          run_suite() {
            local name=$1; shift
            echo "::group::$name"
            if "$@"; then echo "::endgroup::"; else echo "::error::$name failed"; failed+=("$name"); echo "::endgroup::"; fi
          }
          run_suite smoke "${display[@]}" npm run smoke
          run_suite test:desktop "${display[@]}" npm run test:desktop
          # 真实最小化/恢复需要窗口管理器，仅有 X server 不够。
          if [ "$RUNNER_OS" = Linux ]; then
            run_suite test:background xvfb-run -a bash -c '
              openbox >/dev/null 2>&1 &
              wm=$!
              trap "kill $wm 2>/dev/null || true" EXIT
              for attempt in {1..50}; do
                if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
                sleep 0.1
              done
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" || exit 1
              npm run test:background
            '
          else
            run_suite test:background npm run test:background
          fi
          run_suite test:update-ui "${display[@]}" npm run test:update-ui
          run_suite test:ui-ux "${display[@]}" npm run test:ui-ux
          run_suite test:settings-safety "${display[@]}" npm run test:settings-safety
          run_suite test:cancel-side-effects "${display[@]}" npm run test:cancel-side-effects
          run_suite test:newtab-i18n "${display[@]}" npm run test:newtab-i18n
          run_suite test:app-i18n "${display[@]}" npm run test:app-i18n
          # 保持 960脳640 DIP 窗口在强制 2x 缩放下仍在显示区内。
          if [ "$RUNNER_OS" = Linux ]; then
            run_suite test:display-matrix xvfb-run -a -s '-screen 0 2560x1600x24' npm run test:display-matrix
          else
            run_suite test:display-matrix npm run test:display-matrix
          fi
          run_suite test:bridge-autolaunch "${display[@]}" npm run test:bridge-autolaunch
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi
      - name: Package and validate platform assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            npm run dist:linux -- --publish never
          else
            npm run dist -- --publish never
          fi
          node scripts/release-assets.mjs prepare "${{ matrix.platform }}"
      - name: Verify connect-only installer against the packaged app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/test-connect-flow.mjs
          else
            node scripts/test-connect-flow.mjs
          fi
      - name: Launch Linux AppImage and connect its MCP bridge
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a npm run smoke -- release/*.AppImage
          xvfb-run -a npm run test:bridge-autolaunch -- release/*.AppImage
      - name: Install Windows NSIS package, exercise MCP and uninstall
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          $installDir = Join-Path $env:RUNNER_TEMP 'aa-browser-installed'
          $installer = Start-Process -Wait -PassThru -WindowStyle Hidden -FilePath "release/aa-browser-setup-$version.exe" -ArgumentList "/S /D=$installDir"
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed: $($installer.ExitCode)" }
          npm run smoke -- (Join-Path $installDir 'Aa Browser.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Start-Process -Wait -PassThru -WindowStyle Hidden -FilePath (Join-Path $installDir 'Uninstall Aa Browser.exe') -ArgumentList '/S'
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path (Join-Path $installDir 'Aa Browser.exe'))) { throw 'NSIS uninstall failed' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: release-${{ matrix.platform }}
          path: release/validated/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tested release
    if: github.repository == 'yuchen0x1/aa-browser' && startsWith(github.ref, 'refs/tags/v')
    needs: [static, unit, desktop]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check version and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test -s "release-notes-$RELEASE_TAG.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate SBOM for the tested release
        run: npm run sbom
      - run: node scripts/release-assets.mjs manifest
      - name: Publish and verify assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishRelease } = await import(process.cwd() + '/scripts/publish-release.mjs')
            await publishRelease(github.rest.repos, context.repo, context.ref.slice('refs/tags/'.length), context.sha, core.info)
