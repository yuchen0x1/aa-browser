name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 工具合约漂移检查：v0.6.0 曾把 3 个 mock 工具漏在桥外，导致对客户端不可见。
      # 这里在主进程 / MCP 桥 / README 三方之间做一致性断言。
      - name: Tool contract drift check
        run: npm run check:tools

      - name: Build (main / preload / renderer / mcp bridge)
        run: npm run build

      - name: End-to-end smoke test
        run: npm run smoke
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "Tag v$tag does not match package.json version $version" }

      - name: Build Windows installer and update metadata
        run: npm run dist -- --publish always
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Aa Browser ${{ github.ref_name }}
          body_path: release-notes-${{ github.ref_name }}.md
          files: release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
