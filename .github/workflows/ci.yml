name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 工具合约漂移检查：v0.6.0 曾把 3 个 mock 工具漏在桥外，导致对客户端不可见。
      # 这里在主进程 / MCP 桥 / README 三方之间做一致性断言。
      - name: Tool contract drift check
        run: npm run check:tools

      - name: Codex MCP configuration validation
        run: npm run validate:codex

      - name: Build (main / preload / renderer / mcp bridge)
        run: npm run build

      - name: End-to-end smoke test
        run: npm run smoke
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Native desktop regression test
        run: npm run test:desktop

      - name: Update notification UI regression test
        run: npm run test:update-ui

      - name: Persistence regression test
        run: npm run test:stores

      - name: Updater state regression test
        run: npm run test:updater

      - name: Release metadata regression test
        run: npm run test:release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "Tag v$tag does not match package.json version $version" }

      - name: Build Windows installer and update metadata
        run: npm run dist -- --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt

      - name: Create or update GitHub Release and upload assets
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require('node:crypto')
            const fs = require('node:fs')
            const path = require('node:path')

            const { owner, repo } = context.repo
            const tag = context.ref.replace(/^refs\/tags\//, '')
            const name = `Aa Browser ${tag}`
            const body = fs.readFileSync(`release-notes-${tag}.md`, 'utf8')
            const assetsDir = path.resolve('release')
            const assetNames = fs.readdirSync(assetsDir).filter(file =>
              file.endsWith('.exe') || file === 'latest.yml' ||
              file.endsWith('.blockmap') || file === 'SHA256SUMS.txt'
            ).sort()

            if (!assetNames.some(file => file.endsWith('.exe')) ||
                !assetNames.includes('latest.yml') ||
                !assetNames.some(file => file.endsWith('.blockmap')) ||
                !assetNames.includes('SHA256SUMS.txt')) {
              throw new Error(`Release asset set is incomplete: ${assetNames.join(', ')}`)
            }

            async function findRelease() {
              try {
                return (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data
              } catch (error) {
                if (error.status !== 404) throw error
                const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 })
                return releases.find(release => release.tag_name === tag) || null
              }
            }

            // Existing releases are treated as immutable metadata. This keeps asset
            // repair working even when GitHub has more than one release record for
            // the same tag and rejects metadata updates with already_exists.
            let release = await findRelease()
            let created = false
            if (!release) {
              try {
                release = (await github.rest.repos.createRelease({
                  owner, repo, tag_name: tag, name, body, draft: true, prerelease: false,
                })).data
                created = true
              } catch (error) {
                if (error.status !== 422) throw error
                release = await findRelease()
                if (!release) throw error
              }
            }

            if (release.immutable) throw new Error(`Release ${tag} is immutable and cannot be updated`)
            if (created) {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, tag_name: tag,
                target_commitish: context.sha, name, body,
                draft: true, prerelease: false,
              })
            }

            let { data: existingAssets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100,
            })
            for (const assetName of assetNames) {
              const filePath = path.join(assetsDir, assetName)
              const data = fs.readFileSync(filePath)
              const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`
              const existing = existingAssets.find(asset => asset.name === assetName)
              if (existing && existing.digest === digest) {
                core.info(`Already uploaded with matching SHA-256: ${assetName}`)
                continue
              }
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id })
                existingAssets = existingAssets.filter(asset => asset.id !== existing.id)
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: assetName, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': String(data.length) },
                request: { timeout: 300000 },
              })
              core.info(`Uploaded ${assetName} (${data.length} bytes)`)
              existingAssets.push({ name: assetName })
            }

            const { data: uploadedAssets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100,
            })
            const uploadedNames = new Set(uploadedAssets.map(asset => asset.name))
            const missing = assetNames.filter(file => !uploadedNames.has(file))
            if (missing.length) throw new Error(`Release is missing assets: ${missing.join(', ')}`)

            if (release.draft) {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, tag_name: tag,
                target_commitish: context.sha, draft: false, make_latest: 'true',
              })
            }
            // Verify the public lookup: a successful PATCH alone does not prove
            // the provider kept the requested tag or published the draft.
            const { data: verifiedRelease } = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
            if (verifiedRelease.id !== release.id || verifiedRelease.tag_name !== tag || verifiedRelease.draft) {
              throw new Error(`Release verification failed for ${tag}: id=${verifiedRelease.id}, tag=${verifiedRelease.tag_name}, draft=${verifiedRelease.draft}`)
            }
            core.info(`${created ? 'Published' : 'Repaired'} ${tag}: ${assetNames.join(', ')}`)
