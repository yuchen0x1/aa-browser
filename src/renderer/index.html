<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Aa Browser</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="btn-newtab" title="新建标签页 (Ctrl+T)">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="win-spacer"></div>
      </div>
      <div id="toolbar">
        <button id="btn-back" class="navbtn" title="后退 (Alt+←)">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M10.5 2.5L5 8l5.5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-forward" class="navbtn" title="前进 (Alt+→)">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M5.5 2.5L11 8l-5.5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-reload" class="navbtn" title="刷新 (F5)">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="omnibox-wrap">
          <span id="site-icon">
            <svg width="13" height="13" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M1.5 8h13M8 1.5c-4.5 4.5-4.5 8.5 0 13 4.5-4.5 4.5-8.5 0-13z" stroke="currentColor" fill="none" stroke-width="1.1"/></svg>
          </span>
          <input id="omnibox" spellcheck="false" autocomplete="off" placeholder="搜索或输入网址 (Ctrl+L)" />
          <div id="suggest-panel" class="suggest-panel" hidden>
            <div id="suggest-list" class="suggest-list"></div>
          </div>
        </div>
        <button id="agent-pill" title="AI Agent 连接状态">○ 未连接</button>
        <button id="btn-feed" class="navbtn" title="查看 Agent 实时活动日志">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-downloads" class="navbtn" title="下载">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.5v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-settings" class="navbtn" title="设置">
          <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button id="agent-stop" class="agent-stop" title="中断 Agent 的后续浏览器操作">中断</button>
      </div>
      <div id="approval-panel" class="approval-panel" hidden></div>
      <div id="action-feed-drawer" class="action-feed-drawer" hidden>
        <div class="drawer-header">
          <span>Agent 实时活动日志</span>
          <button id="btn-close-feed" class="drawer-close">×</button>
        </div>
        <div id="action-feed-list" class="drawer-content">
          <div class="empty-feed">暂无 Agent 操作记录</div>
        </div>
      </div>
      <div id="download-panel" class="download-panel" hidden>
        <div class="drawer-header">
          <span>下载记录</span>
          <button id="btn-close-dl" class="drawer-close">×</button>
        </div>
        <div id="download-list" class="drawer-content">
          <div class="empty-feed">暂无下载记录</div>
        </div>
      </div>
      <div id="settings-modal" class="settings-modal" hidden>
        <div class="settings-card">
          <div class="drawer-header">
            <span>设置</span>
            <button id="btn-close-settings" class="drawer-close">×</button>
          </div>
          <div class="settings-body">
            <div class="settings-group">
              <div class="settings-label">默认搜索引擎</div>
              <select id="set-engine" class="settings-select"></select>
              <input id="set-engine-url" class="settings-input" type="text" placeholder="自定义搜索基址（以 = 结尾）" />
            </div>
            <div class="settings-group">
              <label class="settings-check">
                <input type="checkbox" id="set-full-snapshot" />
                <span>快照默认全量输出（关闭=增量省 token）</span>
              </label>
            </div>
            <div class="settings-group">
              <label class="settings-check">
                <input type="checkbox" id="set-op-approval" />
                <span>高危操作前弹人工确认（提交表单/下载/登录）</span>
              </label>
            </div>
            <div class="settings-group">
              <div class="settings-label">下载保存目录</div>
              <input id="set-download-dir" class="settings-input" type="text" placeholder="留空=默认 ~/.aabrowser/downloads" />
            </div>
            <div class="settings-group">
              <div class="settings-label">站点白名单</div>
              <textarea id="set-allowed-sites" class="settings-input settings-textarea" rows="4" placeholder="每行一个规则，例如：&#10;https://example.com&#10;https://*.example.org:8443"></textarea>
              <div class="settings-hint">填写后仅允许匹配的 HTTP/HTTPS 站点；留空表示不启用白名单。支持 *.example.com 子域名匹配。</div>
            </div>
            <div class="settings-group">
              <div class="settings-label">Agent 本地服务</div>
              <div id="set-agent-info" class="settings-info">加载中…</div>
            </div>
            <div class="settings-save">
              <button id="btn-save-settings" class="setup-btn">保存设置</button>
              <span id="settings-status" class="settings-status"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/chrome.ts"></script>
  </body>
</html>
