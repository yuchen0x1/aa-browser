<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Aa Browser</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="btn-newtab" title="新建标签页 (Ctrl+T)">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="win-spacer"></div>
      </div>
      <div id="toolbar">
        <button id="btn-back" class="navbtn" title="后退 (Alt+←)">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M10.5 2.5L5 8l5.5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-forward" class="navbtn" title="前进 (Alt+→)">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M5.5 2.5L11 8l-5.5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-reload" class="navbtn" title="刷新 (F5)">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="omnibox-wrap">
          <span id="site-icon">
            <svg width="13" height="13" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M1.5 8h13M8 1.5c-4.5 4.5-4.5 8.5 0 13 4.5-4.5 4.5-8.5 0-13z" stroke="currentColor" fill="none" stroke-width="1.1"/></svg>
          </span>
          <input id="omnibox" spellcheck="false" autocomplete="off" placeholder="搜索或输入网址 (Ctrl+L)" />
        </div>
        <button id="agent-pill" title="AI Agent 连接状态">○ 未连接</button>
        <button id="btn-feed" class="navbtn" title="查看 Agent 实时活动日志">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="agent-stop" class="agent-stop" title="中断 Agent 的后续浏览器操作">中断</button>
      </div>
      <div id="approval-panel" class="approval-panel" hidden></div>
      <div id="action-feed-drawer" class="action-feed-drawer" hidden>
        <div class="drawer-header">
          <span>Agent 实时活动日志</span>
          <button id="btn-close-feed" class="drawer-close">×</button>
        </div>
        <div id="action-feed-list" class="drawer-content">
          <div class="empty-feed">暂无 Agent 操作记录</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/chrome.ts"></script>
  </body>
</html>
