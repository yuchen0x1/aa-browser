appId: com.aa.browser
productName: Aa Browser
copyright: Copyright © 2026 Aa Browser contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - cli/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - cli/**
  - out/bridge/**
electronFuses:
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
toolsets:
  appimage: '1.0.3'
win:
  icon: build/icon.png
  target:
    - target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: aa-browser-setup-${version}.${ext}
  uninstallDisplayName: Aa Browser
  createDesktopShortcut: true
linux:
  executableName: aa-browser
  syncDesktopName: true
  icon: build/icon.png
  category: Network
  target:
    - target: AppImage
      arch: [x64]
  artifactName: aa-browser-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: yuchen0x1
  repo: aa-browser
  releaseType: release
