<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Aa Browser — 404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- For a custom subdirectory, set href to its absolute path ending in /. -->
    <base href="/" />
    <script>
      const siteBase = document.querySelector('base');
      if (siteBase.getAttribute('href') === '/') {
        if (location.protocol === 'file:') {
          siteBase.href = './';
        } else if (location.hostname === 'yuchen0x1.github.io' && location.pathname.split('/')[1] === 'aa-browser') {
          siteBase.href = '/aa-browser/';
        }
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f11'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-size='18' font-weight='bold' fill='%2378cbb9'%3EAa%3C/text%3E%3C/svg%3E" />
    <style>
      /* The host serves this document at the missing URL; rendering needs no assets. */
      :root {
        color-scheme: dark;
        --canvas: #0b0f11;
        --text: #e8eeec;
        --muted: #a3b1ae;
        --dim: #839390;
        --mint: #78cbb9;
        --line: rgba(232, 238, 236, 0.09);
        --line-strong: rgba(232, 238, 236, 0.16);
        --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(ellipse 75% 65% at 50% 0%, rgba(120, 203, 185, 0.13), transparent), var(--canvas);
        color: var(--text);
        font: 1rem/1.7 "Inter", "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      }
      h1, p {
        margin: 0;
      }
      :focus-visible {
        outline: 2px solid var(--mint);
        outline-offset: 3px;
      }
      .notfound {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px clamp(20px, 5vw, 44px);
      }
      .notfound__inner {
        max-width: 640px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--mint);
        font: 11px/1.7 var(--font-mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 22px;
        height: 1px;
        background: currentColor;
        opacity: 0.55;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
        color: inherit;
        font-size: 0.94rem;
        font-weight: 580;
        text-decoration: none;
      }
      .btn--ghost:hover {
        border-color: var(--mint);
      }
      .btn--primary {
        border-color: transparent;
        background: linear-gradient(180deg, #a9ead9, #7dcdbb);
        color: #06130f;
      }
      .btn--primary:hover {
        background: #a9ead9;
      }
      .notfound__code {
        font-family: var(--font-mono);
        font-size: clamp(5rem, 18vw, 9rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(120, 203, 185, 0.5);
      }
      .notfound h1 {
        margin-top: 22px;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: -0.03em;
        font-weight: 620;
      }
      .notfound p {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .notfound__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }
      .notfound__hint {
        margin-top: 34px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main class="notfound">
      <div class="notfound__inner">
        <div class="notfound__code">404</div>
        <span class="eyebrow">Page not found</span>
        <h1>这个页面没有 ref 编号。</h1>
        <p>地址可能拼错，或者页面已经搬到别处。回到首页，或者直接翻工具手册。</p>
        <div class="notfound__actions">
          <a class="btn btn--primary" href="index.html">回到首页</a>
          <a class="btn btn--ghost" href="tools.html">打开工具手册</a>
          <a class="btn btn--ghost" href="https://github.com/yuchen0x1/aa-browser" target="_blank" rel="noopener">GitHub</a>
        </div>
        <div class="notfound__hint">aa-browser://snapshot → 404 · 提示：工具栏地址栏可以直接搜索</div>
      </div>
    </main>
  </body>
</html>
