<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Aa Browser — 404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/icon.png" type="image/png" />
    <link rel="stylesheet" href="assets/site.css?v=0.2.0" />
    <style>
      .notfound {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 0;
      }
      .notfound__inner {
        max-width: 640px;
      }
      .notfound__code {
        font-family: var(--font-mono);
        font-size: clamp(5rem, 18vw, 9rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(120, 203, 185, 0.5);
      }
      .notfound h1 {
        margin-top: 22px;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: -0.03em;
        font-weight: 620;
      }
      .notfound p {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .notfound__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }
      .notfound__hint {
        margin-top: 34px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="notfound">
      <div class="shell notfound__inner">
        <div class="notfound__code">404</div>
        <span class="eyebrow">Page not found</span>
        <h1>这个页面没有 ref 编号。</h1>
        <p>地址可能拼错，或者页面已经搬到别处。回到首页，或者直接翻工具手册。</p>
        <div class="notfound__actions">
          <a class="btn btn--primary" href="index.html">回到首页</a>
          <a class="btn btn--ghost" href="tools.html">打开工具手册</a>
          <a class="btn btn--ghost" href="https://github.com/yuchen0x1/aa-browser" target="_blank" rel="noopener">GitHub</a>
        </div>
        <div class="notfound__hint">aa-browser://snapshot → 404 · 提示：工具栏地址栏可以直接搜索</div>
      </div>
    </main>
  </body>
</html>
