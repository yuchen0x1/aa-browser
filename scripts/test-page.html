<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Aa 快照引擎测试页</title>
    <style>
      body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
      h1 { font-size: 26px; }
      h2 { font-size: 18px; margin-top: 28px; color: #4f8cff; }
      .row { margin: 12px 0; }
      input[type='text'] { padding: 8px 10px; width: 300px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      button { padding: 8px 18px; border: none; background: #4f8cff; color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; margin-left: 8px; }
      select { padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
      #out { margin-top: 14px; padding: 14px; background: #f0f4ff; border-radius: 8px; min-height: 20px; font-size: 14px; }
      footer { margin-top: 40px; color: #999; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Aa 快照引擎测试页</h1>
    <p>本页面用于端到端冒烟测试：无网络依赖，包含典型交互元素。</p>

    <h2>搜索演示</h2>
    <div class="row">
      <input id="q" type="text" placeholder="搜索内容" aria-label="搜索框" />
      <button id="go" aria-label="执行搜索">搜索</button>
    </div>
    <div id="out">（尚未搜索）</div>

    <h2>下拉与复选</h2>
    <div class="row">
      <label for="lang">界面语言</label>
      <select id="lang">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
      <label style="margin-left: 16px"><input type="checkbox" id="agree" /> 同意条款</label>
    </div>

    <h2>链接</h2>
    <p><a href="#sec-end">跳转到页尾</a>（页内锚点）</p>

    <footer id="sec-end">© Aa Browser 冒烟测试</footer>

    <script>
      document.getElementById('go').addEventListener('click', function () {
        var q = document.getElementById('q').value.trim()
        var lang = document.getElementById('lang').value
        var agreed = document.getElementById('agree').checked
        document.getElementById('out').textContent =
          '已搜索: ' + (q || '(空)') + ' | 语言: ' + lang + ' | 同意: ' + (agreed ? '是' : '否')
      })
    </script>
  </body>
</html>
